name: Validar materiales

on:
  push:
    paths: ["materiales/**", "semanas/**", "scripts/**"]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validar_materiales.py
